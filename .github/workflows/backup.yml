# NFR reliability: automated daily database backups kept for at least 7 days (decision D-28).
# The dump is encrypted before upload because it contains customers' personal data (RA 10173).
# Repository secrets needed: BACKUP_DATABASE_URL (the live project's direct connection, port 5432)
# and BACKUP_PASSPHRASE (a long random passphrase kept by the team; needed to restore).
name: Nightly database backup

on:
  schedule:
    - cron: "0 18 * * *" # 02:00 Philippine time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install the PostgreSQL 16 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          file="aurelius-$(date -u +%Y-%m-%d).dump"
          /usr/lib/postgresql/16/bin/pg_dump --format=custom --no-owner --no-privileges \
            --schema=public --schema=auth --schema=storage "$DATABASE_URL" --file "$file"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PASSPHRASE" --symmetric --cipher-algo AES256 "$file"
          rm "$file"
          ls -lh "$file.gpg"
      - uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: "*.dump.gpg"
          retention-days: 7
          if-no-files-found: error
